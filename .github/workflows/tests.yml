name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol, settings, runtime, and GUI tests
        env:
          NECKER_GUI_SMOKE: '1'
        run: python -m unittest discover -s tests -v
  environment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the complete locked environment
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies and compiled keyboard hook
        run: |
          python -m pip check
          python -c "import importlib.metadata as m; import pyWinhook; assert m.version('psychopy') == '2026.2.4'; assert m.version('pyglet') == '1.4.11+necker1'"
